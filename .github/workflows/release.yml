name: Release Obsidian plugin

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run release:prepare
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Upload complete assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" \
            --notes-file dist/release-notes.md \
            dist/release/main.js dist/release/manifest.json dist/release/styles.css \
            dist/release/SHA256SUMS.txt dist/release/THIRD-PARTY-LICENSES.txt
          gh release edit "$RELEASE_TAG" --draft=false --latest
